name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        include:
          # exercise the optional camera extra on one job per minor band
          - python-version: "3.11"
            camera: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          if [ "${{ matrix.camera }}" = "1" ]; then
            pip install .[camera]
          fi
      - name: Run test suite
        run: pytest -v
      - name: Conformance vectors self-check
        run: python test_vectors/generate_vectors.py --verify

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Run JavaScript conformance tests
        run: |
          node javascript/test_encoder.js
          node javascript/test_decoder.js
