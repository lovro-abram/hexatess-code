name: Publish to PyPI

# Publishes hexatess-code to PyPI using Trusted Publishing (OIDC) —
# no API tokens stored in the repository.
#
# One-time setup on PyPI (as project owner):
#   pypi.org → account → Publishing → "Add a new pending publisher"
#     PyPI project name:  hexatess-code
#     Owner:              lovro-abram
#     Repository:         hexatess-code
#     Workflow filename:  publish.yml
#     Environment:        (leave blank)
#
# Triggers:
#   - manually (Actions → Publish to PyPI → Run workflow)
#   - automatically when a GitHub Release is published

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Required for Trusted Publishing (OIDC exchange with PyPI)
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
